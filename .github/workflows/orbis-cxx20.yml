name: Orbis C++20 runtime validation
on:
  push:
    branches: [full-core-linux-smoke]
    paths: ['.github/workflows/orbis-cxx20.yml', 'experiments/orbis_cxx20/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbis-cxx20-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: 87f0227cb60147a26a1eeb4fb06e3b505e9c7261
          path: vendor/llvm-project
          sparse-checkout: |
            cmake
            runtimes
            libcxx
            libc
            libcxxabi
            libunwind
            llvm/cmake
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build unzip curl \
            xvfb xauth libvulkan1 mesa-vulkan-drivers libwayland-client0 libdecor-0-0 \
            libxkbcommon0 libglfw3 libgles2 libasound2t64 libpulse0 libopenal1 libudev1 \
            libxcursor1 libxi6 libxss1 libxtst6 libxrandr2 libxfixes3 libboost1.83-dev
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Fetch public OpenOrbis SDK without changing it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cxx-sdk" build/cxx-evidence
          curl --fail --location --retry 3 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/toolchain-llvm-18.2.zip -o "$RUNNER_TEMP/cxx-sdk.zip"
          echo "5006bb8629a40093b712fac971456fa4d5ad3fafaadb16d11c10b8a93b8b496f  $RUNNER_TEMP/cxx-sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/cxx-sdk.zip" -d "$RUNNER_TEMP/cxx-sdk"
          mapfile -t TAR < <(find "$RUNNER_TEMP/cxx-sdk" -name 'toolchain-llvm-*.tar.gz')
          test "${#TAR[@]}" -eq 1
          tar -xzf "${TAR[0]}" -C "$RUNNER_TEMP/cxx-sdk"
          mapfile -t CRT < <(find "$RUNNER_TEMP/cxx-sdk" -path '*/lib/crt1.o')
          test "${#CRT[@]}" -eq 1
          SDK="${CRT[0]%/lib/crt1.o}"
          chmod +x "$SDK/bin/linux/create-fself"
          echo "OO_PS4_TOOLCHAIN=$SDK" >> "$GITHUB_ENV"
          ls -l "$SDK/lib" > build/cxx-evidence/sdk-libraries.txt
          git -C vendor/llvm-project rev-parse HEAD > build/cxx-evidence/llvm-revision.txt
      - name: Prepare isolated C-header compatibility overlay
        run: |
          python3 experiments/orbis_cxx20/prepare_sdk.py --sdk "$OO_PS4_TOOLCHAIN" --output build/c-header-overlay
          sha256sum "$OO_PS4_TOOLCHAIN/include/math.h" > build/cxx-evidence/original-sdk-math.sha256
          python3 -m unittest discover -s experiments/orbis_cxx20 -p 'test_*.py' -v
      - name: Verify target library availability with real ELF links
        run: |
          python3 experiments/orbis_cxx20/probe_sdk_libraries.py --output build/cxx-evidence/sdk-probes
      - name: Select musl locale and conservative atomic wait for Orbis
        run: |
          python3 experiments/orbis_cxx20/prepare_runtime.py --source vendor/llvm-project
          git -C vendor/llvm-project diff -- libcxx libcxxabi libunwind > build/cxx-evidence/llvm-orbis.patch
      - name: Configure isolated LLVM C++ runtimes for Orbis
        run: |
          set -euo pipefail
          cmake -S vendor/llvm-project/runtimes -B build/cxx-runtime -G Ninja \
            -C "$PWD/build/cxx-evidence/sdk-probes/sdk-link-checks.cmake" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/experiments/orbis_cxx20/toolchain.cmake" \
            -DSO_ORBIS_C_OVERLAY="$PWD/build/c-header-overlay" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/cxx-prefix" \
            -DLLVM_ENABLE_RUNTIMES='libunwind;libcxxabi;libcxx' \
            -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF -DLLVM_INCLUDE_TESTS=OFF \
            -DLIBCXX_INCLUDE_TESTS=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF \
            -DLIBCXX_ENABLE_SHARED=OFF -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_EXCEPTIONS=ON -DLIBCXX_ENABLE_RTTI=ON \
            -DLIBCXX_ENABLE_THREADS=ON -DLIBCXX_HAS_PTHREAD_API=ON \
            -DLIBCXX_HAS_MUSL_LIBC=ON -DLIBCXX_ENABLE_TIME_ZONE_DATABASE=OFF \
            -DLIBCXXABI_ENABLE_SHARED=OFF -DLIBCXXABI_ENABLE_STATIC=ON \
            -DLIBCXXABI_USE_LLVM_UNWINDER=ON -DLIBCXXABI_INCLUDE_TESTS=OFF \
            -DLIBUNWIND_ENABLE_SHARED=OFF -DLIBUNWIND_ENABLE_STATIC=ON -DLIBUNWIND_IS_BAREMETAL=ON \
            -DLIBUNWIND_INCLUDE_TESTS=OFF \
            2>&1 | tee build/cxx-evidence/configure.log
      - name: Build and install isolated runtime archives
        run: |
          set -euo pipefail
          cmake --build build/cxx-runtime --parallel 2 2>&1 | tee build/cxx-evidence/build.log
          cmake --install build/cxx-runtime 2>&1 | tee build/cxx-evidence/install.log
          find build/cxx-prefix -type f -name '*.a' -exec sha256sum {} \; > build/cxx-evidence/archive-hashes.txt
          test -s build/cxx-evidence/archive-hashes.txt
          printf '%s\n' 'Build evidence only until separate native execution steps pass. No full core/game claim.' > build/cxx-evidence/SCOPE.txt
      - name: Build the modern-library Orbis test executable
        run: |
          cmake -S experiments/orbis_cxx20/probe -B build/cxx-probe -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/experiments/orbis_cxx20/consumer_toolchain.cmake" \
            -DSO_CXX_PREFIX="$PWD/build/cxx-prefix" -DSO_ORBIS_C_OVERLAY="$PWD/build/c-header-overlay"
          cmake --build build/cxx-probe --parallel 2
          python3 scripts/audit_binary.py build/cxx-probe/orbis-cxx20-probe.elf
          sha256sum build/cxx-probe/orbis-cxx20-probe.oelf > build/cxx-evidence/probe-sha256.txt
      - name: Fetch pinned emulator and prepare disposable runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cxx-shad"
          curl --fail --location --retry 3 https://github.com/shadps4-emu/shadPS4/releases/download/v.0.18.0/shadps4-linux-sdl-0.18.0.zip -o "$RUNNER_TEMP/cxx-shad.zip"
          echo "3cf0f669c089411775a2434a41ca9c391fb7d24c1a1521ee45dd1d36f390c4a4  $RUNNER_TEMP/cxx-shad.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/cxx-shad.zip" -d "$RUNNER_TEMP/cxx-shad"
          mapfile -t APP < <(find "$RUNNER_TEMP/cxx-shad" -iname '*.appimage')
          test "${#APP[@]}" -eq 1
          chmod +x "${APP[0]}"
          echo "SHADPS4_BIN=${APP[0]}" >> "$GITHUB_ENV"
          echo "ORIGINAL_MMAP_MIN=$(sysctl -n vm.mmap_min_addr)" >> "$GITHUB_ENV"
          sudo sysctl -w vm.mmap_min_addr=0
          LVP=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$LVP"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
      - name: Execute C++20 primitives on the Orbis ABI
        run: |
          python3 experiments/orbis_cxx20/run_probe.py --emulator "$SHADPS4_BIN" \
            --executable build/cxx-probe/orbis-cxx20-probe.oelf --output build/cxx-evidence/native-runtime
      - uses: actions/checkout@v4
        with:
          repository: dougchansan/suyu-v0.0.4
          ref: e6f53df9f160903fd15ed2b0cd91ac60f1f43428
          path: vendor/suyu
          sparse-checkout: src/common
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: boostorg/context
          ref: boost-1.83.0
          path: vendor/context
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fmtlib/fmt
          ref: 12.1.0
          path: vendor/fmt
          persist-credentials: false
      - name: Build real Suyu Common against the modern Orbis runtime
        run: |
          mkdir -p vendor/boost-headers
          cp -a /usr/include/boost vendor/boost-headers/
          cmake -S experiments/orbis_host_common -B build/common-modern-orbis -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/experiments/orbis_cxx20/consumer_toolchain.cmake" \
            -DSO_CXX_PREFIX="$PWD/build/cxx-prefix" -DSO_ORBIS_C_OVERLAY="$PWD/build/c-header-overlay" \
            -DSO_SUYU_SOURCE="$PWD/vendor/suyu" -DSO_BOOST_HEADERS="$PWD/vendor/boost-headers" \
            -DSO_BOOST_CONTEXT="$PWD/vendor/context" -DSO_FMT_SOURCE="$PWD/vendor/fmt"
          cmake --build build/common-modern-orbis --parallel 2
          python3 scripts/audit_binary.py build/common-modern-orbis/suyu-orbis-host-common.elf
      - name: Execute real Common memory, clocks, threads, and fibers
        run: |
          python3 scripts/ci/run_orbis_host_common.py --emulator "$SHADPS4_BIN" \
            --executable build/common-modern-orbis/suyu-orbis-host-common.oelf \
            --output build/cxx-evidence/native-common
      - name: Restore disposable runner mapping policy
        if: always()
        run: |
          if test -n "${ORIGINAL_MMAP_MIN:-}"; then sudo sysctl -w "vm.mmap_min_addr=$ORIGINAL_MMAP_MIN"; fi
      - name: Preserve exact build inputs and diagnostics
        if: always()
        run: |
          mkdir -p build/cxx-evidence
          git archive HEAD > build/cxx-evidence/project-source.tar
          cp build/cxx-runtime/CMakeCache.txt build/cxx-evidence/ 2>/dev/null || true
          cp build/cxx-runtime/compile_commands.json build/cxx-evidence/ 2>/dev/null || true
          cp build/cxx-runtime/CMakeFiles/CMakeConfigureLog.yaml build/cxx-evidence/ 2>/dev/null || true
          tar --exclude=.git --exclude=test --exclude=tests -czf build/cxx-evidence/llvm-runtime-sources.tar.gz \
            -C vendor/llvm-project cmake runtimes libcxx libc libcxxabi libunwind llvm/cmake
          if test -d build/cxx-prefix; then tar -czf build/cxx-evidence/runtime-prefix.tar.gz -C build cxx-prefix; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbis-cxx20-build-${{ github.sha }}
          path: |
            build/cxx-evidence/
            build/cxx-probe/orbis-cxx20-probe.elf
            build/cxx-probe/orbis-cxx20-probe.oelf
            build/common-modern-orbis/suyu-orbis-host-common.elf
            build/common-modern-orbis/suyu-orbis-host-common.oelf
          retention-days: 7
