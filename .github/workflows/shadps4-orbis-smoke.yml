name: shadPS4 OpenOrbis render probe

on:
  push:
    branches: [full-core-linux-smoke]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadps4-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHADPS4_VERSION: "0.18.0"
      SHADPS4_SHA256: "3cf0f669c089411775a2434a41ca9c391fb7d24c1a1521ee45dd1d36f390c4a4"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build, display, trace and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 ninja-build unzip curl ca-certificates \
            xvfb xauth xdotool ffmpeg strace python3-pil \
            vulkan-tools mesa-vulkan-drivers libvulkan1 libfuse2 \
            libx11-6 libxext6 libwayland-client0 libdecor-0-0 libxkbcommon0 \
            libglfw3 libgles2 libasound2t64 libpulse0 libopenal1 libudev1 \
            libxcursor1 libxi6 libxss1 libxtst6 libxrandr2 libxfixes3
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      - name: Install public OpenOrbis release SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/toolchain-llvm-18.2.zip \
            -o "$RUNNER_TEMP/openorbis.zip"
          echo "5006bb8629a40093b712fac971456fa4d5ad3fafaadb16d11c10b8a93b8b496f  $RUNNER_TEMP/openorbis.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/openorbis.zip" -d "$RUNNER_TEMP/openorbis"
          mapfile -t ARCHIVE < <(find "$RUNNER_TEMP/openorbis" -name 'toolchain-llvm-*.tar.gz' -type f)
          test "${#ARCHIVE[@]}" -eq 1
          tar -xzf "${ARCHIVE[0]}" -C "$RUNNER_TEMP/openorbis"
          mapfile -t CRT < <(find "$RUNNER_TEMP/openorbis" -path '*/lib/crt1.o' -type f)
          test "${#CRT[@]}" -eq 1
          SDK="${CRT[0]%/lib/crt1.o}"
          chmod +x "$SDK/bin/linux/create-fself"
          echo "OO_PS4_TOOLCHAIN=$SDK" >> "$GITHUB_ENV"

      - name: Cross-build and verify converted PS4 ELF
        run: |
          cmake --preset orbis
          cmake --build build/orbis --target suyu-orbis-render-probe --parallel 2
          test -s build/orbis/suyu-orbis-render-probe.oelf
          file build/orbis/suyu-orbis-render-probe.elf build/orbis/suyu-orbis-render-probe.oelf
          llvm-nm -C build/orbis/suyu-orbis-render-probe.elf | grep -E 'sceVideoOut(Open|RegisterBuffers|SubmitFlip)|sceKernel(MapDirectMemory|AllocateDirectMemory)'
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path('build/orbis/suyu-orbis-render-probe.oelf').read_bytes()
          assert data[:4] == b'\x7fELF', 'Missing ELF header'
          assert data[7] == 9, f'Expected FreeBSD OSABI, got {data[7]}'
          elf_type = struct.unpack_from('<H', data, 16)[0]
          assert elf_type == 0xfe10, f'Expected ET_SCE_DYNEXEC, got {elf_type:#x}'
          print('Converted PS4 ELF: FreeBSD OSABI, ET_SCE_DYNEXEC (0xfe10).')
          PY

      - name: Download pinned official shadPS4 SDL release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadps4"
          curl --fail --location --retry 3 \
            "https://github.com/shadps4-emu/shadPS4/releases/download/v.${SHADPS4_VERSION}/shadps4-linux-sdl-${SHADPS4_VERSION}.zip" \
            -o "$RUNNER_TEMP/shadps4.zip"
          echo "${SHADPS4_SHA256}  $RUNNER_TEMP/shadps4.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/shadps4.zip" -d "$RUNNER_TEMP/shadps4"
          mapfile -t APPS < <(find "$RUNNER_TEMP/shadps4" -maxdepth 3 -type f -iname '*.appimage')
          test "${#APPS[@]}" -eq 1
          chmod +x "${APPS[0]}"
          echo "SHADPS4_BIN=${APPS[0]}" >> "$GITHUB_ENV"

      - name: Verify software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          LVP="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$LVP"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP" vulkaninfo --summary | grep -E 'deviceName|driverName|apiVersion' | head -n 20

      - name: Permit guest low-address reservations on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadps4-render"
          original=$(sysctl -n vm.mmap_min_addr)
          echo "SHADPS4_MMAP_MIN_ADDR_ORIGINAL=$original" >> "$GITHUB_ENV"
          printf 'Original vm.mmap_min_addr=%s\n' "$original" | tee "$RUNNER_TEMP/shadps4-render/mmap-policy.txt"
          # Limit this exception to the disposable hosted VM; the emulator is NOT root.
          sudo sysctl -w vm.mmap_min_addr=0 | tee -a "$RUNNER_TEMP/shadps4-render/mmap-policy.txt"
          python3 - <<'PY'
          import ctypes
          import os
          libc = ctypes.CDLL(None, use_errno=True)
          libc.mmap.argtypes = [ctypes.c_void_p, ctypes.c_size_t, ctypes.c_int,
                                ctypes.c_int, ctypes.c_int, ctypes.c_long]
          libc.mmap.restype = ctypes.c_void_p
          libc.munmap.argtypes = [ctypes.c_void_p, ctypes.c_size_t]
          libc.munmap.restype = ctypes.c_int
          size = os.sysconf('SC_PAGE_SIZE')
          result = libc.mmap(None, size, 0, 0x100000 | 0x02 | 0x20, -1, 0)
          if result == ctypes.c_void_p(-1).value:
              error = ctypes.get_errno()
              raise OSError(error, os.strerror(error))
          if result is not None:
              libc.munmap(result, size)
              raise RuntimeError(f'Expected address zero; received {result:#x}')
          if libc.munmap(None, size) != 0:
              error = ctypes.get_errno()
              raise OSError(error, os.strerror(error))
          print('Unprivileged low-address mmap preflight passed (one page at zero).')
          PY

      - name: Render PS4 framebuffer in shadPS4 and capture it
        shell: bash
        run: |
          set -euo pipefail
          EMU_DIR="$RUNNER_TEMP/shadps4-render"
          mkdir -p "$EMU_DIR/user/data" "$EMU_DIR/xdg"
          # v0.18.0 CreateDefaultUsers() opens AskMigrationOption() whenever
          # home/1000 does not exist, even on an empty install. This isolated
          # CI profile has no saves to migrate. Create empty homes explicitly
          # so the unmodified emulator can boot without a modal SDL dialog.
          for user in 1000 1001 1002 1003; do
            mkdir -p "$EMU_DIR/user/home/$user/"{savedata,trophy,inputs}
          done
          chmod 700 "$EMU_DIR/xdg"
          cd "$EMU_DIR"
          export DISPLAY=:99
          export XDG_RUNTIME_DIR="$EMU_DIR/xdg"
          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=dummy
          export ALSOFT_DRIVERS=null
          cleanup() {
            if [[ -n "${SHAD_PID:-}" ]]; then
              kill -- "-$SHAD_PID" 2>/dev/null || true
              sleep 1
              kill -9 -- "-$SHAD_PID" 2>/dev/null || true
            fi
            if [[ -n "${XVFB_PID:-}" ]]; then
              kill "$XVFB_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2
          xdotool getdisplaygeometry
          rm -f user/data/suyu-orbis-render-probe.json
          setsid "$SHADPS4_BIN" --config-clean --fullscreen true \
            "$GITHUB_WORKSPACE/build/orbis/suyu-orbis-render-probe.oelf" \
            >shadps4-stdout.log 2>&1 &
          SHAD_PID=$!
          found=0
          for _ in $(seq 1 30); do
            if test -s user/data/suyu-orbis-render-probe.json; then
              found=1
              break
            fi
            if ! kill -0 "$SHAD_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo '--- launcher stdout/stderr ---'
          cat shadps4-stdout.log || true
          echo '--- shadPS4 logs ---'
          for f in user/log/*.log user/log/*.txt; do
            test -f "$f" && { echo "### $f"; tail -200 "$f"; }
          done
          echo '--- user files ---'
          find user -maxdepth 3 -type f -print
          if test "$found" -ne 1; then
            echo 'Guest render marker was not created; collecting a short syscall trace.'
            ffmpeg -hide_banner -loglevel error -y -f x11grab -video_size 1280x720 \
              -i :99 -frames:v 1 startup-failure.png || true
            kill -- "-$SHAD_PID" 2>/dev/null || true
            sleep 1
            kill -9 -- "-$SHAD_PID" 2>/dev/null || true
            wait "$SHAD_PID" 2>/dev/null || true
            SHAD_PID=""
            rm -f trace.*
            timeout --kill-after=2s 8s strace -ff -tt -s 256 -o trace \
              "$SHADPS4_BIN" --config-clean --fullscreen true \
              "$GITHUB_WORKSPACE/build/orbis/suyu-orbis-render-probe.oelf" \
              >trace-stdout.log 2>&1 || true
            cat trace-stdout.log || true
            tail -n 120 trace.* || true
            exit 1
          fi
          cat user/data/suyu-orbis-render-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('user/data/suyu-orbis-render-probe.json').read_text())
          assert data['passed'] is True, data
          assert data['stage'] == 'frame_submitted', data
          assert data['width'] == 1280 and data['height'] == 720, data
          PY
          sleep 2
          ffmpeg -hide_banner -loglevel error -y -f x11grab -video_size 1280x720 \
            -i :99 -frames:v 1 render-probe.png
          sleep 1
          ffmpeg -hide_banner -loglevel error -y -f x11grab -video_size 1280x720 \
            -i :99 -frames:v 1 render-probe-second.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          bars = [(255,255,255), (255,255,0), (0,255,255), (0,255,0),
                  (255,0,255), (255,0,0), (0,0,255), (16,16,16)]
          results = []
          for filename in ('render-probe.png', 'render-probe-second.png'):
              im = Image.open(filename).convert('RGB')
              assert im.size == (1280, 720), im.size
              checks = 0
              for y in (96, 608):
                  for i, expected in enumerate(bars):
                      actual = im.getpixel((80 + i*160, y))
                      if i == 7:
                          assert max(actual) <= 96, (filename, i, actual)
                      else:
                          assert all(abs(a-b) <= 16 for a,b in zip(actual, expected)), (filename, i, actual, expected)
                      checks += 1
              for row in range(9):
                  for col in range(12):
                      actual = im.getpixel((464 + col*32, 232 + row*32))
                      light = (col ^ row) & 1
                      assert max(actual)-min(actual) <= 8, (filename, 'checker channels', actual)
                      assert (min(actual) >= 220 if light else max(actual) <= 96), (filename, 'checker', col, row, actual)
                      checks += 1
              for xy in ((4,4), (640,4), (1275,360), (4,360), (640,715)):
                  assert min(im.getpixel(xy)) >= 240, (filename, 'border', xy, im.getpixel(xy))
                  checks += 1
              results.append({'file': filename, 'size': list(im.size), 'pattern_checks': checks, 'passed': True})
          Path('capture-validation.json').write_text(json.dumps(results, indent=2)+'\n')
          print(json.dumps(results, indent=2))
          PY
          cp render-probe.png "$GITHUB_WORKSPACE/render-probe.png"
          cp user/data/suyu-orbis-render-probe.json "$GITHUB_WORKSPACE/render-probe.json"

      - name: Restore runner low-address mapping policy
        if: always()
        shell: bash
        run: |
          if [ -n "${SHADPS4_MMAP_MIN_ADDR_ORIGINAL:-}" ]; then
            sudo sysctl -w "vm.mmap_min_addr=$SHADPS4_MMAP_MIN_ADDR_ORIGINAL"
          fi

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-openorbis-render-${{ github.sha }}
          path: |
            render-probe.png
            render-probe.json
            ${{ runner.temp }}/shadps4-render/
            build/orbis/suyu-orbis-render-probe.elf
            build/orbis/suyu-orbis-render-probe.oelf
          if-no-files-found: warn
