name: Full Suyu no-JIT Linux smoke

on:
  push:
    branches: [full-core-linux-smoke]
    paths:
      - '.github/workflows/full-core-linux-smoke.yml'
      - 'experiments/full_core_smoke/**'
      - 'integrations/**'
      - 'include/suyu_orbis/**'
      - 'src/registry.c'
      - 'scripts/import_modules.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-core-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/runner/.cache/suyu-full-core-ccache
  CCACHE_MAXSIZE: 2G

jobs:
  full-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout suyu-orbis experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Suyu source
        uses: actions/checkout@v4
        with:
          repository: dougchansan/suyu-v0.0.4
          ref: e6f53df9f160903fd15ed2b0cd91ac60f1f43428
          path: upstream-suyu
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Restore full-core compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/suyu-full-core-ccache
          key: full-core-gcc13-e6f53df9-v1-${{ github.sha }}
          restore-keys: full-core-gcc13-e6f53df9-v1-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build nasm autoconf curl ca-certificates ccache \
            glslang-tools \
            libboost-dev libboost-filesystem-dev libboost-context-dev \
            libusb-1.0-0-dev libssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libswscale-dev libswresample-dev \
            libzstd-dev liblz4-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxkbcommon-dev libxss-dev libxtst-dev \
            libwayland-dev libwayland-egl1 wayland-protocols libdecor-0-dev \
            libegl-dev libdrm-dev libgbm-dev libvulkan-dev
          ccache --zero-stats

      - name: Install CMake 3.31.6
        run: |
          curl --fail --location --retry 3 -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          sudo mkdir -p /opt/cmake
          sudo tar xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          echo /opt/cmake/bin >> "$GITHUB_PATH"

      - name: Emit original AArch64 fixture with real Suyu exporter
        run: |
          set -euo pipefail
          mkdir -p build/full-core-fixture
          c++ -std=c++20 -O1 \
            -I "$GITHUB_WORKSPACE/upstream-suyu/src/core/recompiler" \
            experiments/full_core_smoke/upstream_fixture.cpp \
            -o build/full-core-fixture/emit-fixture
          ./build/full-core-fixture/emit-fixture build/full-core-fixture/exefs
          python3 scripts/import_modules.py \
            --exefs build/full-core-fixture/exefs \
            --output build/full-core-fixture/bundle

      - name: Inject experiment target into pinned Suyu build
        run: |
          cat >> upstream-suyu/CMakeLists.txt <<EOF
          include("$GITHUB_WORKSPACE/experiments/full_core_smoke/suyu_integration.cmake")
          EOF
          tail -n 4 upstream-suyu/CMakeLists.txt

      - name: Configure real Suyu core without Dynarmic
        run: |
          cmake --version
          cmake -S upstream-suyu -B build/full-suyu -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSUYU_NO_JIT=ON \
            -DBUILD_TESTING=OFF \
            -DDYNARMIC_TESTS=OFF \
            -DENABLE_QT=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_LIBUSB=OFF \
            -DENABLE_OPENGL=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_DOWNLOAD_TIME_ZONE_DATA=ON \
            -DYUZU_DISABLE_LLVM=ON \
            -Dfmt_FORCE_BUNDLED=ON \
            -DYUZU_BUILD_PRESET=generic \
            -DSO_FULL_CORE_BUNDLE="$GITHUB_WORKSPACE/build/full-core-fixture/bundle"

      - name: Export public sources and resolved dependencies for offline sandbox
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/sandbox-inputs"
          STAGE="$RUNNER_TEMP/sandbox-sources"
          mkdir -p "$OUT" "$STAGE/suyu-orbis" "$STAGE/upstream-suyu"
          # Export tracked project content, never working-tree private files.
          git archive HEAD | tar -xf - -C "$STAGE/suyu-orbis"
          # Include checked-out public submodules, but no .git credentials or metadata.
          tar --exclude=.git -C upstream-suyu -cf - . | tar -xf - -C "$STAGE/upstream-suyu"
          # Undo ONLY this workflow's injected absolute include in the export.
          git -C upstream-suyu show HEAD:CMakeLists.txt > "$STAGE/upstream-suyu/CMakeLists.txt"
          tar -czf "$OUT/project-sources.tar.gz" -C "$STAGE" suyu-orbis
          tar -czf "$OUT/upstream-with-submodules.tar.gz" -C "$STAGE" upstream-suyu
          find build/full-suyu/_deps -mindepth 1 -maxdepth 1 -type d -name '*-src' -printf '%f\n' \
            | sort > "$OUT/dependency-directories.txt"
          test -s "$OUT/dependency-directories.txt"
          tar --exclude=.git -czf "$OUT/resolved-dependency-sources.tar.gz" \
            -C build/full-suyu/_deps -T "$OUT/dependency-directories.txt"
          git rev-parse HEAD > "$OUT/project-revision.txt"
          git -C upstream-suyu rev-parse HEAD > "$OUT/upstream-revision.txt"
          git -C upstream-suyu submodule status --recursive > "$OUT/submodule-revisions.txt"
          cp build/full-suyu/CMakeCache.txt "$OUT/ci-CMakeCache.txt"
          cp build/full-suyu/compile_commands.json "$OUT/ci-compile-commands.json"
          dpkg-query -W > "$OUT/ci-package-versions.txt"
          printf '%s\n' \
            'Public source/dependency bundle; no games, keys, firmware, proprietary SDKs or Git credentials.' \
            'Sources are portable; ci-CMakeCache.txt and compile commands are provenance only.' \
            'Configure a fresh build and regenerate local module imports; do not reuse CI absolute paths.' \
            'System development packages are separate: see the sandbox dependency retrieval workflow.' \
            > "$OUT/README.txt"
          (cd "$OUT" && sha256sum *.tar.gz > SHA256SUMS)
          du -h "$OUT/"*.tar.gz

      - name: Make fetched sources available to sandbox immediately
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-full-core-sources-${{ github.sha }}
          path: build/sandbox-inputs/
          compression-level: 0
          retention-days: 7

      - name: Build real core, bridge, generated modules, and smoke executable
        id: build
        run: |
          set -o pipefail
          cmake --build build/full-suyu \
            --target core suyu_orbis_bridge so_module_bundle suyu_orbis_full_core_smoke \
            --parallel 3 2>&1 | tee build/full-core-build.log

      - name: Prove no Dynarmic/JIT symbols are linked
        run: |
          BIN=build/full-suyu/bin/suyu_orbis_full_core_smoke
          test -x "$BIN"
          python3 scripts/audit_binary.py "$BIN"
          if nm -C "$BIN" | grep -E 'Dynarmic::|ArmDynarmic'; then
            echo 'Dynarmic symbol unexpectedly present in no-JIT smoke binary' >&2
            exit 1
          fi

      - name: Execute real ArmRecomp to real HLE and resume
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SUYU_RECOMP_STRICT: '1'
        run: |
          set -o pipefail
          timeout --kill-after=5s 90s build/full-suyu/bin/suyu_orbis_full_core_smoke \
            2>&1 | tee build/full-core-smoke.json
          grep -q '"passed":true' build/full-core-smoke.json
          grep -q '"svc":30' build/full-core-smoke.json
          grep -q '"jit_available":false' build/full-core-smoke.json

      - name: Preserve linked executable and its runtime dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          BIN=build/full-suyu/bin/suyu_orbis_full_core_smoke
          mkdir -p build/sandbox-runtime/lib
          cp "$BIN" build/sandbox-runtime/
          ldd "$BIN" | tee build/sandbox-runtime/ldd.txt
          ldd "$BIN" | awk '$2 == "=>" && $3 ~ /^\// {print $3}' | sort -u \
            | while IFS= read -r lib; do cp -L "$lib" build/sandbox-runtime/lib/; done
          readelf -l "$BIN" > build/sandbox-runtime/program-headers.txt
          nm -C "$BIN" > build/sandbox-runtime/symbols.txt
          sha256sum "$BIN" > build/sandbox-runtime/executable-sha256.txt
          printf '%s\n' \
            'Linux test executable, not a PS4 app or a game.' \
            'Ubuntu 24.04 runtime libraries included for debugging; do not install them system-wide.' \
            'Try the binary with host libraries first. Keep any compatibility loader isolated.' \
            > build/sandbox-runtime/README.txt
          tar -czf build/sandbox-runtime.tar.gz -C build sandbox-runtime

      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Full-core Linux smoke'
            echo
            echo '- Suyu: `e6f53df9f160903fd15ed2b0cd91ac60f1f43428`'
            echo '- Configuration: `SUYU_NO_JIT=ON`'
            echo '- Fixture: original synthetic AArch64, exported by pinned Suyu'
            echo '- SVC target: `0x1E GetSystemTick` real HLE implementation'
            echo '- Synthetic context restore, not a production process/scheduler test'
            echo
            if test -f build/full-core-smoke.json; then
              echo '```text'
              cat build/full-core-smoke.json
              echo '```'
            else
              echo 'Smoke executable did not reach its result; inspect the failing build/run step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats || true

      - name: Save compiler cache even after a link or runtime failure
        if: ${{ always() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/suyu-full-core-ccache
          key: full-core-gcc13-e6f53df9-v1-${{ github.sha }}

      - name: Preserve compile and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-core-linux-${{ github.sha }}
          path: |
            build/full-core-build.log
            build/full-core-smoke.json
            build/sandbox-runtime.tar.gz
          if-no-files-found: warn
          retention-days: 14
